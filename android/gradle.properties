# Gradle JVM Memory Allocation
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX Support
android.useAndroidX=true
android.enableJetifier=true

# DISABLE built-in Kotlin (AGP 8.11.1 doesn't support it properly)
android.builtInKotlin=false
android.newDsl=false

# Kotlin incremental compilation (disabled for Windows path issues)
kotlin.incremental=false