<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#111827">BooksBound — Order Status State Diagram</text>
  <text x="40" y="80" font-size="15" fill="#6b7280">orders/{id}.status · every change appends {status, at} to statusHistory, which the customer's Track Order screen shows live</text>

  <!-- start -->
  <circle cx="80" cy="260" r="16" fill="#111827"/>
  <text x="40" y="306" font-size="13.5" fill="#374151">Customer taps</text>
  <text x="40" y="324" font-size="13.5" fill="#374151">"Place Order"</text>
  <line x1="98" y1="260" x2="168" y2="260" stroke="#374151" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- states -->
  <g font-weight="700" font-size="20">
    <rect x="170" y="215" width="210" height="90" rx="45" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="275" y="268" text-anchor="middle" fill="#92400e">Pending</text>

    <rect x="470" y="215" width="210" height="90" rx="45" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text x="575" y="268" text-anchor="middle" fill="#9a3412">Processing</text>

    <rect x="770" y="215" width="210" height="90" rx="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="875" y="268" text-anchor="middle" fill="#1e40af">Shipped</text>

    <rect x="1070" y="215" width="210" height="90" rx="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="1175" y="268" text-anchor="middle" fill="#166534">Delivered</text>

    <rect x="620" y="480" width="210" height="90" rx="45" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="725" y="533" text-anchor="middle" fill="#991b1b">Cancelled</text>
  </g>

  <!-- state descriptions -->
  <g font-size="13.5" fill="#4b5563" text-anchor="middle" font-style="italic">
    <text x="275" y="150">awaiting confirmation</text>
    <text x="575" y="150">books being packed</text>
    <text x="875" y="150">on the way</text>
    <text x="1175" y="150">received by customer</text>
    <text x="725" y="595">will not be delivered</text>
  </g>

  <!-- main transitions -->
  <g stroke="#374151" stroke-width="2.2" fill="none" marker-end="url(#arr)">
    <line x1="380" y1="260" x2="468" y2="260"/>
    <line x1="680" y1="260" x2="768" y2="260"/>
    <line x1="980" y1="260" x2="1068" y2="260"/>
  </g>
  <g font-size="13" fill="#111827" text-anchor="middle">
    <text x="424" y="200">admin:</text><text x="424" y="216">confirm</text>
    <text x="724" y="200">admin:</text><text x="724" y="216">dispatch</text>
    <text x="1024" y="200">admin:</text><text x="1024" y="216">deliver</text>
  </g>

  <!-- final -->
  <line x1="1280" y1="260" x2="1328" y2="260" stroke="#374151" stroke-width="2.2" marker-end="url(#arr)"/>
  <circle cx="1346" cy="260" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <circle cx="1346" cy="260" r="9" fill="#111827"/>
  <line x1="830" y1="525" x2="948" y2="525" stroke="#374151" stroke-width="2.2" marker-end="url(#arr)"/>
  <circle cx="966" cy="525" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <circle cx="966" cy="525" r="9" fill="#111827"/>

  <!-- cancellation transitions -->
  <g stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrRed)">
    <path d="M275 305 C 275 420, 560 525, 618 525"/>
    <path d="M575 305 C 575 400, 650 420, 690 478"/>
    <path d="M875 305 C 875 400, 800 420, 760 478"/>
  </g>
  <text x="120" y="430" font-size="13.5" fill="#dc2626">admin: cancel</text><text x="120" y="448" font-size="12.5" fill="#dc2626">(any active state)</text>

  <!-- notes -->
  <rect x="40" y="620" width="1320" height="76" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <g font-size="13.5" fill="#374151">
    <text x="60" y="648"><tspan font-weight="700">Who changes it:</tspan> admins only (Admin Panel → Manage Orders dropdown; Firestore rules allow order updates for role = admin). The customer only creates the order (status = Pending).</text>
    <text x="60" y="672"><tspan font-weight="700">Implementation:</tspan> OrderService.updateOrderStatus() sets status and appends to statusHistory with FieldValue.arrayUnion · OrderTrackingScreen streams the order document.</text>
  </g>
</svg>
